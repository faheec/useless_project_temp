<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eppa Kettum — A Mostly Useless Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-light:#f6ecd9;
    --bg-mid:#ecd9b2;
    --barn:#8a5a35;
    --barn-dark:#5a3a22;
    --cream:#fffaf0;
    --yolk:#d1852f;
    --ink:#4a3620;
    --comb:#c65d3b;
    --shadow: rgba(90,58,34,0.25);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  body{
    background:
      radial-gradient(circle at 80% 8%, #fff3da 0%, transparent 45%),
      radial-gradient(circle at 12% 85%, #e8cd9a 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-light) 0%, var(--bg-mid) 100%);
    background-attachment: fixed;
    width:100vw; height:100vh;
    position:relative;
  }
  /* soft grain dots texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(rgba(90,58,34,0.05) 1px, transparent 1px);
    background-size: 14px 14px;
    pointer-events:none;
  }
  h1,h2{ font-family:'Fredoka',sans-serif; margin:0; }

  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    opacity:1; transition: opacity .5s ease;
  }
  .screen.hidden{ opacity:0; pointer-events:none; }

  /* ---------- INTRO / PRANK SCREEN ---------- */
  #intro{ justify-content:flex-start; padding-top:6vh; }
  .title{
    font-size: clamp(28px, 5vw, 44px);
    color: var(--barn-dark);
    letter-spacing:.5px;
    text-align:center;
  }
  .subtitle{
    margin-top:8px; font-size:15px; color:#7a6244; text-align:center;
    max-width:360px;
  }

  .hen-wrap{ margin-top: 3vh; transform: scale(1); animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }

  .hen{ position:relative; width:160px; height:150px; }
  .hen .body{
    position:absolute; left:20px; top:40px; width:120px; height:95px;
    background: linear-gradient(160deg, #fffaf0, #f0dcb8);
    border-radius: 58% 55% 50% 50% / 65% 65% 45% 45%;
    box-shadow: inset -10px -8px 18px rgba(138,90,53,0.18);
  }
  .hen .tail{
    position:absolute; left:2px; top:28px; width:46px; height:56px;
    background: linear-gradient(200deg,#f0dcb8,#dcc190);
    border-radius: 50% 60% 40% 70% / 60% 50% 70% 40%;
    transform: rotate(-18deg);
    z-index:0;
  }
  .hen .wing{
    position:absolute; left:58px; top:58px; width:56px; height:46px;
    background: linear-gradient(160deg,#e9d1a3,#d3b17f);
    border-radius: 60% 50% 55% 45% / 70% 60% 60% 40%;
    z-index:2;
  }
  .hen .head{
    position:absolute; left:88px; top:8px; width:56px; height:52px;
    background: linear-gradient(160deg, #fffaf0, #f0dcb8);
    border-radius: 55% 55% 50% 50% / 55% 55% 50% 50%;
    z-index:3;
  }
  .hen .comb{
    position:absolute; left:104px; top:-8px; width:26px; height:18px; z-index:4;
  }
  .hen .comb::before, .hen .comb::after{
    content:""; position:absolute; width:9px; height:14px; background:var(--comb);
    border-radius: 50% 50% 50% 50%;
  }
  .hen .comb::before{ left:0; top:4px; transform:rotate(-10deg); }
  .hen .comb::after{ left:9px; top:0; transform:rotate(8deg); }
  .hen .beak{
    position:absolute; left:138px; top:28px; width:0; height:0; z-index:4;
    border-top:6px solid transparent; border-bottom:6px solid transparent;
    border-left:12px solid var(--yolk);
  }
  .hen .wattle{
    position:absolute; left:126px; top:36px; width:8px; height:12px;
    background:var(--comb); border-radius:0 0 50% 50%; z-index:3;
  }
  .hen .eye{
    position:absolute; left:120px; top:24px; width:6px; height:6px; border-radius:50%;
    background:#3a2a18; z-index:5; animation: blink 4.5s infinite;
  }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1);} 95%{ transform:scaleY(0.1);} }
  .hen .leg{
    position:absolute; bottom:-10px; width:4px; height:22px; background:var(--yolk); z-index:1;
  }
  .hen .leg.l1{ left:56px; }
  .hen .leg.l2{ left:78px; }
  .hen .leg::after{
    content:""; position:absolute; bottom:-6px; left:-5px; width:14px; height:4px;
    background:var(--yolk); border-radius:2px;
  }

  .stage{
    position:relative;
    width:min(90vw, 480px); height:130px;
    margin-top: 3vh;
  }
  #playBtn{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:20px;
    color:#fffaf0;
    background: linear-gradient(160deg, var(--yolk), #b96a24);
    border:none; border-radius:16px;
    padding:16px 34px;
    box-shadow: 0 8px 0 var(--barn-dark), 0 12px 16px var(--shadow);
    cursor:pointer;
    transition: transform .18s ease, left .7s ease, top .7s ease;
  }
  #playBtn:active{ transform:translate(-50%,-46%); }
  #playBtn.shrink{ padding:8px 16px; font-size:13px; border-radius:10px; box-shadow: 0 4px 0 var(--barn-dark);}
  #playBtn.shake{ animation: shake .35s; }
  @keyframes shake{ 0%,100%{transform:translate(-50%,-50%) rotate(0);} 25%{transform:translate(-50%,-50%) rotate(-4deg);} 75%{transform:translate(-50%,-50%) rotate(4deg);} }

  .toast{
    margin-top: 14px; min-height: 22px; font-size:14px; color:var(--barn-dark); font-weight:600;
    text-align:center;
  }

  /* ---------- GAME SCREEN ---------- */
  #game{ justify-content:flex-start; padding-top: 3vh; }
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    width:min(92vw,520px); font-weight:700; color:var(--barn-dark);
  }
  .hud span.label{ font-family:'Fredoka',sans-serif; font-size:15px; }
  .field{
    position:relative;
    width:min(92vw, 520px); height:62vh; margin-top: 10px;
    background: linear-gradient(180deg, transparent 0%, rgba(138,90,53,0.06) 100%);
    border-radius: 20px;
    overflow:hidden;
    border: 2px solid rgba(138,90,53,0.18);
  }
  .hen-perch{
    position:absolute; top:6px; left:50%; transform:translateX(-50%) scale(0.85);
  }
  .egg{
    position:absolute; font-size:28px; will-change: top, left;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,0.15));
  }
  .splat{
    position:absolute; width:46px; height:34px; pointer-events:none;
    animation: splatIn .28s ease-out forwards;
  }
  @keyframes splatIn{ 0%{ transform:scale(0.4); opacity:0; } 60%{ transform:scale(1.08); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
  .splat .yolk{
    position:absolute; left:13px; top:12px; width:20px; height:14px; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #f3b25a, var(--yolk) 70%);
    box-shadow: 0 1px 3px rgba(90,58,34,0.25);
  }
  .splat .shard{
    position:absolute; width:13px; height:11px;
    background: linear-gradient(160deg, #fffaf0, #e8d6b3);
    border: 1px solid rgba(138,90,53,0.35);
    box-shadow: inset -2px -2px 3px rgba(138,90,53,0.15);
  }
  .splat .shard.s1{ left:0; top:0; clip-path: polygon(0 100%, 100% 0, 100% 100%); transform: rotate(-8deg); }
  .splat .shard.s2{ left:26px; top:0; clip-path: polygon(0 0, 100% 0, 0 100%); transform: rotate(10deg); }
  .splat .shard.s3{ left:2px; top:20px; clip-path: polygon(0 0, 100% 0, 100% 100%); transform: rotate(16deg); }
  .splat .shard.s4{ left:29px; top:19px; clip-path: polygon(0 0, 100% 100%, 0 100%); transform: rotate(-12deg); }
  .crack-msg{
    position:absolute; font-size:13px; font-weight:700; color:var(--barn-dark);
    background:var(--cream); padding:3px 8px; border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
    animation: floatUp 1s ease forwards;
    pointer-events:none;
  }
  @keyframes floatUp{ 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-28px);} }
  .basket{
    position:absolute; bottom:6px; font-size:40px;
    transform:translateX(-50%);
    filter: drop-shadow(0 4px 3px rgba(0,0,0,0.2));
  }
  .footnote{
    margin-top:10px; font-size:12.5px; color:#8a7454; text-align:center; max-width:400px;
  }
  #restartBtn{
    margin-top:8px; font-family:'Nunito',sans-serif; font-weight:700; font-size:13px;
    background:none; border:1.5px solid var(--barn); color:var(--barn-dark);
    padding:6px 14px; border-radius:20px; cursor:pointer;
  }

  /* ---------- LOSE OVERLAY ---------- */
  .lose-overlay{
    position:absolute; inset:0;
    background: rgba(74,54,32,0.72);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .4s ease;
    z-index:20;
  }
  .lose-overlay.show{ opacity:1; pointer-events:auto; }
  .lose-card{
    background: var(--cream);
    border-radius:22px;
    padding: 28px 30px 22px;
    width:min(84vw, 340px);
    text-align:center;
    box-shadow: 0 14px 0 var(--barn-dark), 0 18px 26px rgba(0,0,0,0.3);
    transform: translateY(10px) scale(0.96);
    transition: transform .4s ease;
  }
  .lose-overlay.show .lose-card{ transform: translateY(0) scale(1); }
  .lose-title{
    font-size:26px; color:var(--comb); letter-spacing:.5px;
  }
  .lose-stats{
    margin-top:14px; display:flex; flex-direction:column; gap:6px;
    font-size:14.5px; font-weight:700; color:var(--barn-dark);
  }
  .lose-stats .row{ display:flex; justify-content:space-between; }
  .lose-note{ margin-top:12px; font-size:12.5px; color:#8a7454; }
  .lose-actions{ margin-top:18px; display:flex; gap:10px; justify-content:center; }
  .lose-actions button{
    font-family:'Nunito',sans-serif; font-weight:700; font-size:13px;
    border-radius:20px; padding:8px 16px; cursor:pointer;
  }
  #playAgainBtn{ border:none; background: linear-gradient(160deg, var(--yolk), #b96a24); color:#fffaf0; }
  #backBtn{ border:1.5px solid var(--barn); background:none; color:var(--barn-dark); }
  .lose-actions button:disabled{
    opacity:0.4; cursor:not-allowed; pointer-events:none;
  }
</style>
</head>
<body>

<div id="intro" class="screen">
  <h1 class="title">ippa Kittum</h1>
  <p class="subtitle">Press play. See what happens. (Good luck.)</p>

  <div class="hen-wrap">
    <div class="hen">
      <div class="tail"></div>
      <div class="body"></div>
      <div class="wing"></div>
      <div class="leg l1"></div>
      <div class="leg l2"></div>
      <div class="head"></div>
      <div class="comb"></div>
      <div class="wattle"></div>
      <div class="eye"></div>
      <div class="beak"></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <button id="playBtn">▶ PLAY</button>
  </div>
  <div class="toast" id="toast">&nbsp;</div>
</div>

<div id="game" class="screen hidden">
  <div class="hud">
    <span class="label">🥚 eggs dropped</span>
    <span id="countDropped">0</span>
    <span class="label">💥 cracked</span>
    <span id="countCracked">0</span>
  </div>
  <div class="field" id="field">
    <div class="hen-perch">
      <div class="hen" style="transform:scale(0.8)">
        <div class="tail"></div>
        <div class="body"></div>
        <div class="wing"></div>
        <div class="leg l1"></div>
        <div class="leg l2"></div>
        <div class="head"></div>
        <div class="comb"></div>
        <div class="wattle"></div>
        <div class="eye"></div>
        <div class="beak"></div>
      </div>
    </div>
    <div class="basket" id="basket">🧺</div>
  </div>
  <p class="footnote">Catch them, miss them — every single egg cracks. That's just how it goes here.</p>

  <div class="lose-overlay" id="loseOverlay">
    <div class="lose-card">
      <div class="lose-title">YOU LOSE</div>
      <div class="lose-stats">
        <div class="row"><span>Total eggs cracked</span><span id="finalCracked">0</span></div>
        <div class="row"><span>Eggs saved</span><span>0</span></div>
      </div>
      <p class="lose-note">There was never a way to win this one.</p>
      <div class="lose-actions">
        <button id="playAgainBtn">🔁 Play again</button>
        <button id="backBtn">⬅ Back to button</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Audio ---------------- */
  let audioCtx = null;
  function getCtx(){
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    return audioCtx;
  }
  function blip(freq, start, dur, type){
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(60,freq*0.5), ctx.currentTime + start + dur);
    gain.gain.setValueAtTime(0.16, ctx.currentTime + start);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime + start);
    osc.stop(ctx.currentTime + start + dur + 0.02);
  }
  function playCluck(){
    const base = 320 + Math.random()*120;
    blip(base, 0, 0.08, 'square');
    blip(base*0.75, 0.11, 0.09, 'square');
    if(Math.random() > 0.5){ blip(base*1.1, 0.24, 0.06, 'square'); }
  }
  function playCrack(){
    const ctx = getCtx();
    const bufferSize = ctx.sampleRate * 0.12;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.22, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    noise.connect(gain).connect(ctx.destination);
    noise.start();
  }

  /* ---------------- Prank button ---------------- */
  const stage = document.getElementById('stage');
  const btn = document.getElementById('playBtn');
  const toast = document.getElementById('toast');
  let stageCount = 0;
  let moving = false;
  let moveTimer = null;

  const messages = [
    "Hmm. Nothing happened.",
    "Okay, that was weird.",
    "It's shy today.",
    "Almost had it!",
    "It really doesn't want to be pressed.",
    "Getting smaller for no reason.",
    "It has legs now, apparently.",
    "BUCK BUK BUK.",
    "It's just vibing at this point.",
    "Fine. FINE. Let's actually do this."
  ];

  function setToast(text){
    toast.textContent = text;
  }

  function randomPosInStage(){
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const bw = btn.offsetWidth, bh = btn.offsetHeight;
    const x = Math.random() * (sw - bw) + bw/2;
    const y = Math.random() * (sh - bh) + bh/2;
    return {x, y};
  }

  function moveButtonTo(x, y){
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
  }

  function evade(){
    // used on hover approach: jump away (slowed, and less eager to trigger)
    const {x,y} = randomPosInStage();
    moveButtonTo(x,y);
  }

  function startJitter(){
    if(moveTimer) return;
    moving = true;
    moveTimer = setInterval(()=>{
      const {x,y} = randomPosInStage();
      moveButtonTo(x,y);
    }, 1400); // slower jitter interval
  }

  btn.addEventListener('pointerenter', ()=>{
    if(stageCount >= 1 && stageCount < 9 && Math.random() < 0.45){
      evade();
    }
  });

  btn.addEventListener('click', ()=>{
    // unlock audio on first gesture
    getCtx();

    stageCount++;
    setToast(messages[Math.min(stageCount-1, messages.length-1)]);

    if(stageCount === 1){
      btn.classList.add('shake');
      setTimeout(()=>btn.classList.remove('shake'), 350);
    } else if(stageCount === 2){
      const {x,y} = randomPosInStage();
      moveButtonTo(x,y);
    } else if(stageCount === 3){
      btn.classList.add('shrink');
    } else if(stageCount === 4){
      startJitter();
    } else if(stageCount === 5){
      playCluck();
      const {x,y} = randomPosInStage();
      moveButtonTo(x,y);
    } else if(stageCount >= 6 && stageCount < 9){
      if(Math.random() < 0.6) playCluck();
      const {x,y} = randomPosInStage();
      moveButtonTo(x,y);
    } else if(stageCount >= 9){
      clearInterval(moveTimer);
      moveTimer = null;
      launchGame();
    }
  });

  function launchGame(){
    setToast("Loading something... eventually.");
    setTimeout(()=>{
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      startGame();
    }, 700);
  }

  /* ---------------- Egg game ---------------- */
  const field = document.getElementById('field');
  const basket = document.getElementById('basket');
  const countDroppedEl = document.getElementById('countDropped');
  const countCrackedEl = document.getElementById('countCracked');
  const loseOverlay = document.getElementById('loseOverlay');
  const finalCrackedEl = document.getElementById('finalCracked');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const backBtn = document.getElementById('backBtn');

  const MAX_EGGS = 10;
  let dropped = 0, cracked = 0;
  let basketX = 0;
  let gameRunning = false;
  let spawnTimer = null;
  let rafId = null;
  let eggs = [];

  const crackLines = [
    "Caught it! ...and it cracked anyway.",
    "Missed! It cracked anyway.",
    "Perfect catch. Still broke.",
    "So close. Cracked regardless.",
    "That one never stood a chance.",
    "100% catch rate. 100% crack rate."
  ];

  function fieldRect(){ return field.getBoundingClientRect(); }

  function updateBasketPos(clientX){
    const r = fieldRect();
    let x = clientX - r.left;
    x = Math.max(24, Math.min(r.width - 24, x));
    basketX = x;
    basket.style.left = x + 'px';
  }

  field.addEventListener('pointermove', (e)=>{
    updateBasketPos(e.clientX);
  });

  function spawnEgg(){
    if(dropped >= MAX_EGGS){
      clearInterval(spawnTimer);
      return;
    }
    const r = fieldRect();
    const egg = document.createElement('div');
    egg.className = 'egg';
    egg.textContent = '🥚';
    const startX = 30 + Math.random() * (r.width - 60);
    egg.style.left = startX + 'px';
    egg.style.top = '46px';
    field.appendChild(egg);
    eggs.push({el: egg, x: startX, y: 46, speed: 1.6 + Math.random()*1.1, settled:false});
    dropped++;
    countDroppedEl.textContent = dropped;
  }

  function crackEgg(eggObj){
    if(eggObj.settled) return;
    eggObj.settled = true;
    eggObj.el.remove();
    playCrack();
    cracked++;
    countCrackedEl.textContent = cracked;

    const splat = document.createElement('div');
    splat.className = 'splat';
    splat.style.left = (eggObj.x - 23) + 'px';
    splat.style.top = (eggObj.y - 14) + 'px';
    splat.innerHTML =
      '<div class="shard s1"></div><div class="shard s2"></div>' +
      '<div class="shard s3"></div><div class="shard s4"></div>' +
      '<div class="yolk"></div>';
    field.appendChild(splat);
    setTimeout(()=>{ splat.style.transition = 'opacity .5s'; splat.style.opacity = '0'; }, 900);
    setTimeout(()=>{ splat.remove(); }, 1400);

    const msg = document.createElement('div');
    msg.className = 'crack-msg';
    msg.textContent = crackLines[Math.floor(Math.random()*crackLines.length)];
    msg.style.left = Math.max(4, Math.min(fieldRect().width - 140, eggObj.x - 60)) + 'px';
    msg.style.top = (eggObj.y - 10) + 'px';
    field.appendChild(msg);
    setTimeout(()=>{ msg.remove(); }, 1000);

    if(dropped >= MAX_EGGS && eggs.every(e => e.settled)){
      setTimeout(endGame, 700);
    }
  }

  function endGame(){
    stopGame();
    finalCrackedEl.textContent = cracked;
    loseOverlay.classList.add('show');
    // Once you've lost, there's no going back — the back button is permanently disabled.
    backBtn.disabled = true;
  }

  function gameLoop(){
    if(!gameRunning) return;
    const r = fieldRect();
    const floorY = r.height - 34;
    for(const eggObj of eggs){
      if(eggObj.settled) continue;
      eggObj.y += eggObj.speed;
      eggObj.el.style.top = eggObj.y + 'px';

      if(eggObj.y >= floorY){
        crackEgg(eggObj);
      }
    }
    eggs = eggs.filter(e => !e.settled || parseFloat(e.el.style.opacity || '1') > 0);
    rafId = requestAnimationFrame(gameLoop);
  }

  function startGame(){
    dropped = 0; cracked = 0; eggs = [];
    countDroppedEl.textContent = 0;
    countCrackedEl.textContent = 0;
    loseOverlay.classList.remove('show');
    field.querySelectorAll('.egg, .crack-msg, .splat').forEach(n => n.remove());
    updateBasketPos(fieldRect().left + fieldRect().width/2);
    gameRunning = true;
    spawnEgg();
    spawnTimer = setInterval(spawnEgg, 1300);
    rafId = requestAnimationFrame(gameLoop);
  }

  function stopGame(){
    gameRunning = false;
    clearInterval(spawnTimer);
    cancelAnimationFrame(rafId);
  }

  playAgainBtn.addEventListener('click', ()=>{
    startGame();
  });

  // backBtn intentionally has no working click handler once the game has ended —
  // it gets disabled in endGame() and never re-enabled.

})();
</script>
